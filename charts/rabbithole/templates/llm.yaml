apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbithole-llm-proxy
  namespace: {{ .Values.namespace }}
data:
  llm-proxy.mjs: |
{{ .Files.Get "files/llm-proxy.mjs" | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: infisical-kubernetes-auth
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # Public identity identifier; authentication uses the ESO service account.
  identityId: 34e1a3e1-7a11-4676-8ad9-8a96262ef411
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-myinfra
  namespace: {{ .Values.namespace }}
spec:
  provider:
    infisical:
      hostAPI: https://infisical.n1o.ru
      auth:
        kubernetesAuthCredentials:
          identityId:
            name: infisical-kubernetes-auth
            key: identityId
      secretsScope:
        projectSlug: myinfra-kyjq
        environmentSlug: dev
        secretsPath: /rabbithole
        recursive: false
        expandSecretReferences: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbithole-llm
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-myinfra
  target:
    name: rabbithole-llm
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: LITELLM_API_KEY
